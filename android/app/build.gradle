apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// The version is computed by CI at release time and never committed
// (scripts/release-version.mjs): APP_VERSION_NAME is the release, e.g. 0.1.6,
// and APP_VERSION_CODE is major*1e6 + minor*1e3 + patch, so it rises with
// every release. A build without them (local, or CI on a push) is the
// development identity, 0.0.0-dev / 1. capacitor.config.ts reads the same
// APP_VERSION_NAME for the user-agent suffix.
def appVersion = System.getenv('APP_VERSION_NAME') ?: '0.0.0-dev'
def appVersionCode = (System.getenv('APP_VERSION_CODE') ?: '1') as int

android {
    namespace = "me.hadoku.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "me.hadoku.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments notAnnotation: 'me.hadoku.app.LiveProduction'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes from the environment, never from a file in the repo.
    // CI decodes the keystore from the HADOKU_MOBILE_* secrets (see
    // .github/workflows/build-apk.yml); with no KEYSTORE_PASSWORD in the
    // environment a release build is simply unsigned, so a local
    // `assembleRelease` still works and nothing has to be faked.
    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE") ?: "release.keystore"
            storeFile file(keystoreFile)
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildFeatures {
        compose = true
    }
    buildTypes {
        release {
            if (System.getenv("KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.activity:activity-compose:$activityComposeVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion"
    testImplementation "junit:junit:$junitVersion"
    // android.jar's org.json is a stub on the JVM; the real one for unit tests.
    testImplementation "org.json:json:$orgJsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:core:$androidxTestVersion"
    androidTestImplementation "androidx.test:runner:$androidxTestVersion"
    androidTestImplementation "androidx.test:rules:$androidxTestVersion"
    androidTestImplementation platform("androidx.compose:compose-bom:$composeBomVersion")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

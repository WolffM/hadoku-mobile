name: Build Android APK

# The gate AND the ship path. Every push and PR builds a debug APK, so a broken
# shell is red before it is released. A release is the operator's moment:
# `pnpm release patch|minor|major|X.Y.Z` dispatches this workflow on main with
# `release`, which computes the version from the newest v* tag, runs the same
# gate, builds the signed APK with that version, and creates the tag and the
# GitHub Release on the sha it built (which is how the phone gets it:
# sideload). No version is ever committed. Required-context name is `build`
# (hadoku_site repo-policy-manifest.json).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'none, or patch / minor / major / an exact X.Y.Z newer than the latest release'
        required: false
        default: none

# Two releases dispatched together would compute the same version; queue them.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && inputs.release != 'none') && 'release' || github.run_id }}
  cancel-in-progress: false

permissions: read-all

jobs:
  build:
    # Runner SELECTION, not a job-level `if:`: a skipped required check never
    # reports and leaves a PR unmergeable. An unauthorized fork PR lands on
    # GitHub-hosted instead of a claw (a persistent machine on a home LAN).
    # author_association is computed by GitHub, not by the submitter.
    #
    # Bare `vars.CI_RUNNER`, no fallback: this repo is in hadoku_site's
    # fleet-runner-coverage.json (02fe3070), so mgmt-api always keeps the
    # variable set — claw labels normally, hosted while every claw is offline —
    # and a literal here would be a second copy of the label set that nothing
    # keeps in step. check:repo-policy fails on the fallback form.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '["ubuntu-latest"]') || vars.CI_RUNNER) }}
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      # versionName and versionCode come from here, never from a committed
      # file: scripts/release-version.mjs reads the newest v* tag on origin.
      # A build that is not a release carries 0.0.0-dev / 1. A release only
      # from main, so the tag names a commit that went through the gate.
      - name: Derive the version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ] && [ "$RELEASE" != none ]; then
            test "$GITHUB_REF" = refs/heads/main || { echo "::error::release only from main, not $GITHUB_REF"; exit 1; }
            node scripts/release-version.mjs "$RELEASE"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/release-version.mjs
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Capacitor 8 needs Node 22+. pnpm comes from the `packageManager` field
      # via corepack (pnpm/action-setup races itself on shared runners).
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the config and the e2e suite
        run: pnpm typecheck

      - name: Release-version tests
        run: pnpm test:release-version

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      # android-actions/setup-android shells out to `unzip`, which the claw
      # image does not ship.
      - name: Ensure unzip is present
        run: command -v unzip || (sudo apt-get update && sudo apt-get install -y unzip)

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      # capacitor.config.ts reads APP_VERSION_NAME for the user-agent suffix.
      - name: Sync Capacitor config into the Android project
        run: pnpm exec cap sync android
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # `:app:` explicitly: the generated capacitor-cordova-android-plugins
      # module fails its own androidTest duplicate-class check (two old Kotlin
      # stdlibs), and it has no tests of ours. The instrumented tests are
      # compiled here so they cannot rot; they RUN on an emulator
      # (`pnpm test:device`, `pnpm e2e`), which needs KVM. A release runs this
      # too, so it gates the very sha it ships.
      - name: Unit tests, debug APK, and the instrumented tests compiled
        run: cd android && ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: hadoku-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Release: the keystore is a vault item (HADOKU_MOBILE_KEYSTORE_BASE64,
      # provisioned through hadoku_site's `provision-secret`) mirrored into this
      # repo's secrets. The alias is not a secret.
      - name: Decode the release keystore
        if: steps.version.outputs.release == 'true'
        run: echo "${{ secrets.HADOKU_MOBILE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      # The type and entry count only, never a secret: proves the store
      # password opens it before Gradle gets that far.
      - name: Show the keystore type
        if: steps.version.outputs.release == 'true'
        run: keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" | grep -E '^(Keystore type|Your keystore contains)'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.HADOKU_MOBILE_KEYSTORE_PASSWORD }}

      # The keystore is PKCS12 (keytool's default since Java 9), which has ONE
      # password: keytool ignores -keypass for it, so the key's password is
      # the store's. The separately generated HADOKU_MOBILE_KEY_PASSWORD was
      # never applied to the key; the v0.1.0 tag build failed reading the key
      # with it ("Given final block not properly padded").
      - name: Build signed release APK
        if: steps.version.outputs.release == 'true'
        run: cd android && ./gradlew --no-daemon :app:assembleRelease
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.HADOKU_MOBILE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: hadoku-mobile
          KEY_PASSWORD: ${{ secrets.HADOKU_MOBILE_KEYSTORE_PASSWORD }}

      - name: Name the release APK
        if: steps.version.outputs.release == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/hadoku-${{ steps.version.outputs.tag }}.apk

      - name: Create the GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/hadoku-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A red run is seen by nobody unless it says so itself. `always()` so
      # recoveries report too, or the alert state stays broken.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: mobile:build-apk
          service-key: ${{ secrets.KEY_SERVICE_MOBILE }}
          started-at: ${{ env.JOB_STARTED_AT }}
